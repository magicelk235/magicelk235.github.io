<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=JetBrains+Mono:wght@400&display=swap"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        background: #0f0d0b;
        color: #cac2b5;
        font-family: 'Archivo', ui-sans-serif, system-ui, sans-serif;
      }
      main {
        width: 100%;
        max-width: 1200px;
        margin-inline: auto;
        padding: 24px;
      }
      h1 {
        margin: 0;
        color: #f6f1e8;
        font-weight: 800;
        font-stretch: 118%;
        letter-spacing: -0.035em;
        line-height: 0.92;
        font-size: clamp(2.75rem, 7vw, 5rem);
      }
      p {
        margin: 1.5rem 0 0;
        max-width: 46ch;
        font-size: 1.125rem;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        margin-top: 2rem;
        padding-inline: 1.35rem;
        border-radius: 2px;
        background: #f2a63c;
        color: #17120a;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 0.875rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid #f2a63c;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>That page is not here. It may have been renamed, or it never existed in the first place.</p>
      <a href="/">Back to the start</a>
    </main>
  </body>
</html>
